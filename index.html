<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weatherly</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .loader-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .loader-page h1 {
      color: var(--color-primary-dark);
      font-size: 1.4rem;
    }
  </style>
</head>
<body>
  <!-- This page has no UI of its own: it just checks whether the user is
       already logged in and sends them to the right place. -->
  <div class="loader-page">
    <span class="spinner spinner-dark"></span>
    <h1>🌤️ Weatherly</h1>
    <p class="text-muted">Loading...</p>
  </div>

  <!-- Firebase SDKs (only used when DEMO_MODE is false in js/firebase.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Route the visitor to the dashboard if logged in, otherwise to login.
    AuthService.onAuthStateChanged((user) => {
      window.location.href = user ? "dashboard.html" : "login.html";
    });
  </script>
</body>
</html>
