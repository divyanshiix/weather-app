<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In · Weatherly</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <section class="glass-card auth-card fade-in">
      <div class="auth-brand">
        <span class="brand-icon" aria-hidden="true">🌤️</span>
        <h1>Weatherly</h1>
      </div>
      <p class="auth-subtitle">Sign in to check the weather anywhere.</p>

      <div id="login-alert" class="alert alert-error" role="alert"></div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" />
          <span id="login-email-error" class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" />
          <span id="login-password-error" class="field-error"></span>
        </div>

        <button type="submit" id="login-submit" class="btn-primary">
          <span class="btn-label">Log In</span>
          <span class="btn-spinner"><span class="spinner"></span></span>
        </button>
      </form>

      <p class="auth-footer-text">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </section>
  </main>

  <!-- Firebase SDKs (only used when DEMO_MODE is false in js/firebase.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
